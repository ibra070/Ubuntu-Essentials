<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض البيانات من Google Sheets</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .refresh { margin-bottom: 20px; padding: 10px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>البيانات المحفوظة في Google Sheets</h1>
    <button class="refresh" onclick="loadData()">تحديث البيانات</button>
    <div id="dataContainer">
        <p>اضغط على تحديث لعرض البيانات...</p>
    </div>

    <script src="config.js"></script>
    <script>
        async function loadData() {
            try {
                const response = await fetch(CONFIG.GOOGLE_SCRIPT_URL);
                const result = await response.json();

                if (result.success) {
                    let html = '<table><thead><tr>';
                    if (result.data.length > 0) {
                        Object.keys(result.data[0]).forEach(key => {
                            html += `<th>${key}</th>`;
                        });
                        html += '</tr></thead><tbody>';

                        result.data.forEach(row => {
                            html += '<tr>';
                            Object.values(row).forEach(value => {
                                html += `<td>${value}</td>`;
                            });
                            html += '</tr>';
                        });
                        html += '</tbody></table>';
                    } else {
                        html = '<p>لا توجد بيانات بعد.</p>';
                    }

                    document.getElementById('dataContainer').innerHTML = html;
                } else {
                    document.getElementById('dataContainer').innerHTML = '<p>خطأ: ' + result.error + '</p>';
                }
            } catch (error) {
                document.getElementById('dataContainer').innerHTML = '<p>خطأ في تحميل البيانات: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
